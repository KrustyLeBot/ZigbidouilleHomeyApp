# Builds the Petlibro bridge image (bridge/petlibro) and pushes it to GHCR:
#   ghcr.io/<owner>/petlibro-bridge:latest   — every push to main touching the bridge
#   ghcr.io/<owner>/petlibro-bridge:sha-<7>  — the same build, pinned
# The tests run first; a red test means no image.
name: petlibro-bridge

on:
  push:
    branches: [main]
    paths:
      - 'bridge/petlibro/**'
      - '.github/workflows/petlibro-bridge.yml'
  pull_request:
    paths:
      - 'bridge/petlibro/**'
      - '.github/workflows/petlibro-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge/petlibro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/petlibro/package-lock.json
      - run: npm ci
      - run: npm test

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        # GHCR refuses upper case, and the owner here is "KrustyLeBot".
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/petlibro-bridge" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: bridge/petlibro
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
