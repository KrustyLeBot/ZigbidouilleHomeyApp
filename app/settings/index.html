<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Required: without /homey.js the Homey object is never injected, so
         onHomeyReady never runs, Homey.ready() is never called, and the page
         spins on an infinite loading screen. -->
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; padding: 16px; color: #222; }
      h2 { font-size: 18px; margin: 0 0 4px; }
      .intro { font-size: 13px; color: #888; margin: 0 0 12px; }

      /* Tabs keep the three tools apart: the app log, the Zigbee interview and
         the vacuum's raw miIO trace have nothing to do with each other, and
         stacking them made every panel push the next one off-screen. */
      .tabs { display: flex; gap: 4px; border-bottom: 1px solid #ddd; margin-bottom: 16px; }
      .tab {
        padding: 8px 14px; font-size: 14px; cursor: pointer;
        border: none; background: none; color: #666;
        border-bottom: 2px solid transparent;
      }
      .tab.active { color: #00A6A6; border-bottom-color: #00A6A6; font-weight: 600; }
      .panel { display: none; }
      .panel.active { display: block; }

      .row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
      button {
        padding: 8px 16px; font-size: 14px; border-radius: 4px;
        border: 1px solid #ccc; background: #f5f5f5; color: #333; cursor: pointer;
      }
      button.primary { background: #00A6A6; color: #fff; border-color: #00A6A6; }
      select { padding: 7px 8px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; }

      /* Scrolls inside its own box instead of growing the page. */
      ul {
        list-style: none; padding: 0 8px; margin: 0;
        max-height: 340px; overflow-y: auto;
        border: 1px solid #ddd; border-radius: 4px;
      }
      li { border-bottom: 1px solid #eee; padding: 8px 0; font-size: 13px; }
      li:last-child { border-bottom: none; }
      .ctx { font-weight: 600; }
      .msg { color: #c00; }
      li.info .msg { color: #666; }
      li.info .ctx { font-weight: 500; color: #666; }
      .time { color: #999; font-size: 11px; }
      .empty { color: #999; font-size: 13px; }

      textarea {
        width: 100%; height: 300px; box-sizing: border-box;
        font-family: monospace; font-size: 11px;
        border: 1px solid #ccc; border-radius: 4px;
      }
      .verbose { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 12px 0 4px; }

      .field { margin-bottom: 12px; max-width: 420px; }
      .field label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; }
      .field input {
        width: 100%; padding: 8px; box-sizing: border-box;
        border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
      }
      .hint { font-size: 12px; color: #888; margin-top: 4px; }
      .status { margin-top: 10px; font-size: 13px; min-height: 18px; }
      .status.error { color: #c00; }
      .status.busy { color: #888; }
      .status.ok { color: #0a8a3f; }
    </style>
  </head>
  <body>
    <div class="tabs">
      <button type="button" class="tab active" data-panel="log" id="t-tab-log"></button>
      <button type="button" class="tab" data-panel="zigbee" id="t-tab-zigbee"></button>
      <button type="button" class="tab" data-panel="miio" id="t-tab-miio"></button>
      <button type="button" class="tab" data-panel="imou" id="t-tab-imou"></button>
    </div>

    <!-- Log -->
    <section class="panel active" id="panel-log">
      <h2 id="t-err-title"></h2>
      <p class="intro" id="t-err-intro"></p>
      <div class="row">
        <button type="button" class="primary" id="refresh"></button>
        <button type="button" id="err-copy"></button>
        <button type="button" id="clear"></button>
        <select id="device-filter"><option value="">—</option></select>
      </div>
      <ul id="list"></ul>
      <textarea id="err-copy-buf" style="position:absolute;left:-9999px;top:-9999px;"></textarea>

      <label class="verbose">
        <input type="checkbox" id="verbose" />
        <span id="t-verbose"></span>
      </label>
      <p class="intro" id="t-verbose-hint"></p>
    </section>

    <!-- Zigbee dump -->
    <section class="panel" id="panel-zigbee">
      <h2 id="t-zdump-title"></h2>
      <p class="intro" id="t-zdump-intro"></p>
      <div class="row">
        <button type="button" class="primary" id="zdump-load"></button>
        <button type="button" id="zdump-copy"></button>
      </div>
      <textarea id="zdump-out" readonly></textarea>
    </section>

    <!-- Raw miIO log (vacuum) -->
    <section class="panel" id="panel-miio">
      <h2 id="t-log-title"></h2>
      <p class="intro" id="t-log-intro"></p>
      <div class="row">
        <button type="button" class="primary" id="log-load"></button>
        <button type="button" id="log-copy"></button>
        <button type="button" id="log-clear"></button>
        <span id="log-count" style="font-size:13px;color:#666;"></span>
      </div>
      <textarea id="log" readonly></textarea>
    </section>

    <!-- Imou cloud credentials -->
    <section class="panel" id="panel-imou">
      <h2 id="t-imou-title">Imou</h2>
      <p class="intro" id="t-imou-intro"></p>
      <div class="field">
        <label for="imou-app-id" id="t-imou-app-id"></label>
        <input type="text" id="imou-app-id" autocomplete="off" />
      </div>
      <div class="field">
        <label for="imou-app-secret" id="t-imou-app-secret"></label>
        <input type="password" id="imou-app-secret" autocomplete="off" />
      </div>
      <div class="field">
        <label for="imou-host" id="t-imou-host"></label>
        <input type="text" id="imou-host" placeholder="openapi-fk.easy4ip.com" autocomplete="off" />
        <div class="hint" id="t-imou-host-hint"></div>
      </div>
      <div class="row">
        <button type="button" class="primary" id="imou-save"></button>
        <button type="button" id="imou-test"></button>
      </div>
      <div class="status" id="imou-status"></div>
    </section>

    <script type="text/javascript">
      function onHomeyReady(Homey) {
        const __ = (k) => Homey.__('settings.' + k);
        const $ = (id) => document.getElementById(id);

        // --- labels ---
        const labels = {
          't-tab-log': 'tab_log', 't-tab-zigbee': 'tab_zigbee', 't-tab-miio': 'tab_miio',
          't-err-title': 'err_title', 't-err-intro': 'err_intro',
          'refresh': 'refresh', 'err-copy': 'copy', 'clear': 'clear',
          't-verbose': 'verbose', 't-verbose-hint': 'verbose_hint',
          't-zdump-title': 'zdump_title', 't-zdump-intro': 'zdump_intro',
          'zdump-load': 'zdump_load', 'zdump-copy': 'copy',
          't-log-title': 'log_title', 't-log-intro': 'log_intro',
          'log-load': 'load', 'log-copy': 'copy', 'log-clear': 'clear',
          't-tab-imou': 'tab_imou', 't-imou-intro': 'imou_intro',
          't-imou-app-id': 'imou_app_id', 't-imou-app-secret': 'imou_app_secret',
          't-imou-host': 'imou_host_label', 't-imou-host-hint': 'imou_host_hint',
          'imou-save': 'imou_save', 'imou-test': 'imou_test',
        };
        for (const [id, key] of Object.entries(labels)) $(id).textContent = __(key);

        // --- tabs ---
        document.querySelectorAll('.tab').forEach((tab) => {
          tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
            tab.classList.add('active');
            $('panel-' + tab.dataset.panel).classList.add('active');
          });
        });

        // --- log ---
        const listEl = $('list');
        const filterEl = $('device-filter');
        let lastEntries = [];

        const fmt = (t) => new Date(t).toLocaleString();

        // Entries are logged as "Device name: what happened", so the part before
        // the first colon is the device — that is what the filter offers.
        const deviceOf = (e) => (e.context.includes(':') ? e.context.split(':')[0].trim() : '');

        function visible() {
          const want = filterEl.value;
          return want ? lastEntries.filter((e) => deviceOf(e) === want) : lastEntries;
        }

        function render() {
          const entries = visible();
          if (!entries.length) {
            listEl.innerHTML = '<li class="empty">' + __('err_empty') + '</li>';
            return;
          }
          listEl.innerHTML = entries
            .map((e) =>
              '<li class="' + (e.level === 'error' ? 'err' : 'info') + '">' +
              '<div class="ctx">' + e.context + '</div>' +
              '<div class="msg">' + e.message + '</div>' +
              '<div class="time">' + fmt(e.t) + '</div></li>')
            .join('');
        }

        function refreshFilter() {
          const names = [...new Set(lastEntries.map(deviceOf).filter(Boolean))].sort();
          const current = filterEl.value;
          filterEl.innerHTML = '<option value="">' + __('all_devices') + '</option>'
            + names.map((n) => '<option value="' + n + '">' + n + '</option>').join('');
          if (names.includes(current)) filterEl.value = current;
        }

        function load() {
          Homey.api('GET', '/errors', null, (err, result) => {
            if (err) { listEl.innerHTML = '<li class="msg">' + err + '</li>'; return; }
            lastEntries = (result && result.entries) || [];
            refreshFilter();
            render();
          });
        }

        filterEl.addEventListener('change', render);
        $('refresh').addEventListener('click', load);

        $('err-copy').addEventListener('click', () => {
          const buf = $('err-copy-buf');
          const entries = visible();
          buf.value = entries.length
            ? entries.map((e) => fmt(e.t) + '\t' + (e.level === 'error' ? 'ERR ' : 'info') + '\t' + e.context + '\t' + e.message).join('\n')
            : __('err_empty');
          buf.select();
          document.execCommand('copy');
          $('err-copy').textContent = __('copied');
        });

        $('clear').addEventListener('click', () => {
          Homey.confirm(__('confirm_clear'), 'warning', (err, ok) => {
            if (err || !ok) return;
            Homey.api('POST', '/errors/clear', null, () => load());
          });
        });

        // --- verbose toggle (shared by every driver, whatever the protocol) ---
        const verboseEl = $('verbose');
        Homey.get('verbose', (err, value) => { if (!err) verboseEl.checked = Boolean(value); });
        verboseEl.addEventListener('change', () => {
          Homey.set('verbose', verboseEl.checked, (err) => {
            if (err) Homey.alert(err.message || String(err));
          });
        });

        // --- Zigbee dump ---
        const zoutEl = $('zdump-out');
        $('zdump-load').addEventListener('click', () => {
          zoutEl.value = '…';
          Homey.api('GET', '/zigbee', null, (err, result) => {
            zoutEl.value = err ? String(err.message || err) : JSON.stringify(result.devices, null, 2);
          });
        });
        $('zdump-copy').addEventListener('click', () => {
          zoutEl.select();
          document.execCommand('copy');
          $('zdump-copy').textContent = __('copied');
        });

        // --- raw miIO log ---
        const logEl = $('log');
        const logCount = $('log-count');
        function refreshLog() {
          Homey.api('GET', '/log', null, (err, result) => {
            if (err) { logCount.textContent = String(err.message || err); return; }
            logCount.textContent = result.count + ' ' + __('lines');
            logEl.value = result.csv;
          });
        }
        $('log-load').addEventListener('click', refreshLog);
        $('log-copy').addEventListener('click', () => {
          logEl.select();
          document.execCommand('copy');
          $('log-copy').textContent = __('copied');
        });
        $('log-clear').addEventListener('click', () => {
          Homey.confirm(__('confirm_clear_log'), 'warning', (err, ok) => {
            if (err || !ok) return;
            Homey.api('POST', '/log/clear', null, () => { logEl.value = ''; logCount.textContent = ''; });
          });
        });

        // --- Imou cloud credentials ---
        // App-level settings (Homey.get/set), not device settings: configured
        // once, before any camera is paired, which is what lets pairing show a
        // straight picker instead of asking for a secret per device.
        const imouIdEl = $('imou-app-id');
        const imouSecretEl = $('imou-app-secret');
        const imouHostEl = $('imou-host');
        const imouStatusEl = $('imou-status');

        Homey.get('imou_app_id', (err, value) => { if (!err && value) imouIdEl.value = value; });
        Homey.get('imou_app_secret', (err, value) => { if (!err && value) imouSecretEl.value = value; });
        Homey.get('imou_host', (err, value) => { if (!err && value) imouHostEl.value = value; });

        $('imou-save').addEventListener('click', () => {
          Homey.set('imou_app_id', imouIdEl.value.trim(), () => {
            Homey.set('imou_app_secret', imouSecretEl.value.trim(), () => {
              Homey.set('imou_host', imouHostEl.value.trim(), (err) => {
                imouStatusEl.className = 'status ' + (err ? 'error' : 'ok');
                imouStatusEl.textContent = err ? (err.message || String(err)) : __('imou_saved');
              });
            });
          });
        });

        $('imou-test').addEventListener('click', () => {
          imouStatusEl.className = 'status busy';
          imouStatusEl.textContent = __('imou_testing');
          Homey.api('POST', '/imou/test', null, (err, result) => {
            if (err || !result || !result.ok) {
              imouStatusEl.className = 'status error';
              imouStatusEl.textContent = __('imou_test_fail') + ((result && result.error) || (err && err.message) || String(err));
              return;
            }
            imouStatusEl.className = 'status ok';
            imouStatusEl.textContent = __('imou_test_ok').replace('{{count}}', result.count);
            if (result.host) imouHostEl.value = result.host;
          });
        });

        load();
        Homey.ready();
      }
    </script>
  </body>
</html>
