<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- No /homey.js include here: unlike the settings page, the widget host
         injects `Homey`/`onHomeyReady` itself (as does the CLI's own widget
         template, which omits it too). -->
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --fg-dim: #8a8a8a;
        --accent: #00A6A6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f4f4f4;
          --fg-dim: #8e8e8e;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%;
        font-family: -apple-system, system-ui, sans-serif;
        color: var(--fg);
        background: transparent;
        overflow: hidden;
      }
      #wrap {
        height: 100%; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 2px;
        padding: 8px 14px;
      }

      /* The figure is the widget. Everything else is a caption, so nothing else
         gets to compete with it for size. */
      #figure { display: flex; align-items: baseline; line-height: 1; }
      #value { font-size: 40px; font-weight: 800; letter-spacing: -1px; }
      #unit { font-size: 15px; font-weight: 700; color: var(--accent); margin-left: 5px; }

      #label {
        font-size: 9px; font-weight: 700; letter-spacing: 1.2px;
        text-transform: uppercase; color: var(--fg-dim);
      }
      #name { font-size: 11px; font-weight: 500; color: var(--fg-dim); }

      /* Shown only while the figure covers part of the day: a partial total
         presented as the day's is a lie, and this is the one honest way to show
         it without hiding the number. */
      #partial { display: none; font-size: 9px; color: var(--fg-dim); }

      #empty {
        height: 100%; display: none; align-items: center; justify-content: center;
        font-size: 12px; color: var(--fg-dim); text-align: center; padding: 0 20px;
      }
    </style>
  </head>
  <body class="homey-widget">
    <div id="wrap">
      <div id="label">Today</div>
      <div id="figure">
        <span id="value">–</span><span id="unit">kWh</span>
      </div>
      <div id="name"></div>
      <div id="partial"></div>
    </div>
    <div id="empty"></div>

    <script type="text/javascript">
      function onHomeyReady(Homey) {
        // Signal readiness immediately — the API call below is async and must
        // not gate it, or a slow first load reads as a broken widget.
        Homey.ready();

        // Widgets get no `Homey.__()`, so the two languages the app ships are
        // picked from the browser locale rather than Homey's own setting.
        const fr = String(navigator.language || '').toLowerCase().startsWith('fr');
        const T = fr
          ? {
            today: "Aujourd'hui",
            partial: 'depuis l’installation',
            noDevice: 'Aucun appareil avec compteur',
            gone: 'Appareil sélectionné introuvable — voir le journal',
            waiting: 'En attente de la première mesure…',
            unavailable: 'Indisponible',
            unreachable: "Impossible de joindre l'app",
          }
          : {
            today: 'Today',
            partial: 'since install',
            noDevice: 'No metered device',
            gone: 'Selected device not found — see the app log',
            waiting: 'Waiting for the first reading…',
            unavailable: 'Unavailable',
            unreachable: 'Could not reach the app',
          };

        const wrapEl = document.getElementById('wrap');
        const labelEl = document.getElementById('label');
        const valueEl = document.getElementById('value');
        const nameEl = document.getElementById('name');
        const partialEl = document.getElementById('partial');
        const emptyEl = document.getElementById('empty');

        labelEl.textContent = T.today;
        let deviceId = null;

        function showEmpty(message) {
          emptyEl.textContent = message;
          emptyEl.style.display = 'flex';
          wrapEl.style.display = 'none';
        }

        function showFigure() {
          emptyEl.style.display = 'none';
          wrapEl.style.display = 'flex';
        }

        async function load() {
          try {
            const path = deviceId
              ? `/today?device=${encodeURIComponent(deviceId)}`
              : '/today';
            const result = await Homey.api('GET', path);

            if (!result || result.error === 'no_device') return showEmpty(T.noDevice);
            if (result.error === 'device_gone') return showEmpty(T.gone);
            // Transient: the channel's init has not reached the counter yet.
            // Retry in seconds rather than waiting out the 60 s poll, or a state
            // that clears itself in two seconds looks like a stuck widget for a
            // full minute after every app restart.
            if (result.error === 'no_history') {
              showEmpty(T.waiting);
              window.setTimeout(load, 5000);
              return;
            }
            if (result.error) return showEmpty(result.message || T.unavailable);

            showFigure();
            valueEl.textContent = typeof result.kwh === 'number'
              ? result.kwh.toFixed(2)
              : '–';
            nameEl.textContent = result.name || '';
            partialEl.textContent = result.partial ? T.partial : '';
            partialEl.style.display = result.partial ? 'block' : 'none';
          } catch (err) {
            showEmpty(T.unreachable);
          }
        }

        async function init() {
          // The channel the user picked in the widget's own settings. Falls back
          // to the first metered channel so the widget still shows something if
          // the picker was never set.
          try {
            const ids = await Homey.getDeviceIds();
            if (Array.isArray(ids) && ids.length) deviceId = ids[0];
          } catch (err) {
            deviceId = null;
          }

          await load();
          window.setInterval(load, 60000);
        }

        init();
      }
    </script>
  </body>
</html>
