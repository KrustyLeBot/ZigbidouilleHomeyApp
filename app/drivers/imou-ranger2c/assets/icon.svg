  <circle cx="30" cy="29" r="20" fill="#F3F4F6" stroke="#374151" stroke-width="2.5"/>
  <g clip-path="url(#ranger2c-body)">
    <path d="M8 12 L52 12 L52 33 Q30 47 8 33 Z" fill="#1F2937"/>
  </g>
  <circle cx="33" cy="29" r="9.5" fill="#0EA6A6"/>
